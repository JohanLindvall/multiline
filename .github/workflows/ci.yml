name: CI

on:
  push:
    branches: ['**'] # Tag pushes do not start another release cycle.
  pull_request:

permissions:
  contents: read

# Superseded PR/branch checks can stop; main releases run without cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Test (${{ matrix.runner }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            go: '1.22.x'
          - runner: ubuntu-latest
            go: stable
          - runner: ubuntu-24.04-arm
            go: stable
          - runner: macos-latest
            go: stable
          - runner: windows-latest
            go: stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # In particular, the minimum-version test must not auto-upgrade itself.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test -cover ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check formatting and module tidiness
        run: |
          make fmt-check
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Read the shared linter version
        id: lint-version
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.lint-version.outputs.version }}
      - name: Run examples
        run: make examples

  race-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Test with the race detector
        run: make race
      - name: Fuzz
        run: make fuzz
      # Shared runner timings are not performance measurements.
      - name: Benchmarks
        run: go test -run='^$' -bench=. -benchtime=1x ./...
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 14

  # Preserve automatic patch tags, and give users release notes to follow.
  tag:
    needs: [check, lint, race-and-fuzz]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JohanLindvall/multiline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Publish patch tag and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/release.sh
